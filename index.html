<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JH - Store</title>
    <!-- Tailwind CSS CDN for quick styling and FontAwesome for icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b192c;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* Custom background wave/diagonal split effect like image */
        .hero-bg {
            background: linear-gradient(135deg, #0b192c 0%, #1e3e62 100%);
            position: relative;
        }
        .diagonal-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(200, 205, 215, 0.25) 0%, rgba(200, 205, 215, 0.25) 50%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }
        .content-z {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-8 px-4 sm:px-6">

    <div class="w-full max-w-md hero-bg rounded-3xl shadow-2xl overflow-hidden p-6 sm:p-8 flex flex-col items-center text-center relative border border-slate-700/50">
        <!-- Diagonal overlay pattern -->
        <div class="diagonal-bg"></div>

        <!-- Content wrapper -->
        <div class="content-z w-full flex flex-col items-center">
            
            <!-- Profile Image -->
            <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full overflow-hidden border-4 border-red-600/80 shadow-lg mb-4 bg-red-800">
                <img src="https://res.cloudinary.com/czely0wb/image/upload/f_auto,q_auto/photo" alt="Johe Store Profile" class="w-full h-full object-cover">
            </div>

            <!-- Title & Subtitle -->
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wide text-white mb-2">JH Store</h1>
            <p class="text-xs sm:text-sm text-slate-200 font-medium leading-relaxed max-w-xs mb-6">
                Jasa Pembuatan Aplikasi (WebApps) dan <br> AI Engineer
            </p>

            <!-- Social Media Icons Row -->
            <div class="flex items-center justify-center gap-3 mb-8">
                <a href="#" class="w-10 h-10 rounded-xl bg-[#b5837a]/90 hover:bg-[#b5837a] flex items-center justify-center text-white shadow-md transition transform hover:scale-105">
                    <i class="fab fa-facebook-f text-lg"></i>
                </a>
                <a href="#" class="w-10 h-10 rounded-xl bg-[#b5837a]/90 hover:bg-[#b5837a] flex items-center justify-center text-white shadow-md transition transform hover:scale-105">
                    <i class="fab fa-tiktok text-lg"></i>
                </a>
                <a href="#" class="w-10 h-10 rounded-xl bg-[#b5837a]/90 hover:bg-[#b5837a] flex items-center justify-center text-white shadow-md transition transform hover:scale-105">
                    <i class="fab fa-instagram text-lg"></i>
                </a>
                <a href="https://www.youtube.com/@Joko_Herwanto" class="w-10 h-10 rounded-xl bg-[#b5837a]/90 hover:bg-[#b5837a] flex items-center justify-center text-white shadow-md transition transform hover:scale-105">
                    <i class="fab fa-youtube text-lg"></i>
                </a>
            </div>

            <!-- Link Buttons List -->
            <div class="w-full flex flex-col gap-4">
                
                <!-- LinkedIn Button -->
                <a href="#" class="group relative flex items-center justify-between w-full bg-[#0077b5] hover:bg-[#006097] text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition-all duration-200 transform hover:-translate-y-0.5">
                    <div class="absolute left-3.5 w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-cart-shopping text-white text-lg"></i>
                    </div>
                    <span class="w-full text-center text-sm sm:text-base font-semibold tracking-wide">Kumpulan WebApps</span>
                </a>

                <!-- Photography Button -->
                <a href="#" class="group relative flex items-center justify-between w-full bg-[#f4c430] hover:bg-[#e0b225] text-slate-900 font-semibold py-3.5 px-4 rounded-xl shadow-lg transition-all duration-200 transform hover:-translate-y-0.5">
                    <div class="absolute left-3.5 w-9 h-9 rounded-lg bg-black/10 flex items-center justify-center">
                        <i class="fa-solid fa-file text-slate-900 text-lg"></i>
                    </div>
                    <span class="w-full text-center text-sm sm:text-base font-semibold tracking-wide">Tutorial AI</span>
                </a>

                <!-- Email Button -->
                <a href="#" class="group relative flex items-center justify-between w-full bg-[#f26a21] hover:bg-[#dc5b16] text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition-all duration-200 transform hover:-translate-y-0.5">
                    <div class="absolute left-3.5 w-9 h-9 rounded-lg bg-white/20 flex items-center justify-center">
                        <i class="fas fa-envelope text-white text-lg"></i>
                    </div>
                    <span class="w-full text-center text-sm sm:text-base font-semibold tracking-wide">Email</span>
                </a>

            </div>

            <!-- Footer Note / Credit -->
            <div class="mt-8 text-center text-[11px] text-slate-400">
                &copy; 2026 JH Store. All rights reserved.
            </div>

        </div>
    </div>

</body>
</html>
